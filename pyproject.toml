[project]
name = "opsfleet-assignment"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6.1",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.3",
    "langchain-openai>=1.4.1",
    "pandas>=3.0.5",
    "google-cloud-bigquery>=3.43.0",
    "db-dtypes>=1.3.0",
    "deepagents>=0.7.4",
    "langchain>=1.3.14",
    "langfuse>=4.14.3",
    "python-frontmatter>=1.3.0",
    "sqlglot>=25.0.0",
    "langchain-google-genai>=2.0.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.9.0",
    "copilotkit>=0.1.94",
    "ag-ui-langgraph>=0.0.42",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
opsfleet-assignment = "src.app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
