model_list:
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gpt-oss-20b-openrouter
    litellm_params:
      model: openrouter/openai/gpt-oss-20b:free
      api_key: os.environ/OPENROUTER_API_KEY
router_settings:
  fallbacks: [{"gemini-flash": ["gpt-oss-20b-openrouter"]}]

litellm_settings:
  # Not every fallback provider supports every param (e.g. OpenRouter free
  # models rejecting reasoning_effort) - drop unsupported ones instead of
  # failing the whole fallback attempt.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
