- role: human
  content: Who are you and what can you help with?
- role: ai
  content: 'I’m your Retail Insights Agent.


    I help Store and Regional Managers answer business questions about your retail data, including:


    - Sales performance

    - Product and category trends

    - Customer behavior

    - Order patterns

    - Inventory-related performance questions

    - Regional/store comparisons

    - Saved report management


    What I can do:

    - Analyze business performance in plain English

    - Turn questions into clear summaries, tables, and action-oriented reports

    - Compare time periods like last month, quarter to date, or year to date

    - Help identify top products, weak spots, and growth opportunities

    - Save useful reports for later, find past reports, and help delete them with confirmation


    What data I work with:

    - Orders

    - Order line items

    - Products

    - Users/customers


    A few important limits:

    - I focus only on your company’s retail data and reporting

    - I won’t expose private customer details like names, emails, phone numbers, or street addresses

    - I keep things non-technical and give findings, not database mechanics


    If you want, I can also tell you exactly what data fields are available to analyze, or we can jump
    straight into a question like:

    - “How did sales perform last month?”

    - “Which products are underperforming?”

    - “What regions are growing fastest?”

    - “Can you find my saved reports on holiday sales?”'
