- role: human
  content: What does 'AOV' mean in our reporting?
- role: ai
  content: 'AOV means Average Order Value.


    In plain terms, it’s the average amount spent per order.


    Formula:

    - AOV = total sales ÷ number of orders


    Example:

    - If sales were $10,000 across 200 orders, AOV would be $50


    It’s useful for understanding:

    - whether customers are spending more per purchase,

    - the impact of bundling or upselling,

    - and how pricing or promotions affect basket size.


    If you want, I can also explain how AOV differs from:

    - average item price,

    - units per transaction,

    - or customer lifetime value.'
