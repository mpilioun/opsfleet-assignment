- role: ai
  content: 'I have access to 4 read-only tables:


    ### 1) Orders

    Tracks order-level activity.

    - order ID

    - user ID

    - order status

    - customer gender

    - order created timestamp

    - returned timestamp

    - shipped timestamp

    - delivered timestamp

    - number of items in the order


    ### 2) Order Items

    Tracks each item within an order.

    - item ID

    - order ID

    - user ID

    - product ID

    - inventory item ID

    - item status

    - created timestamp

    - shipped timestamp

    - delivered timestamp

    - returned timestamp

    - sale price


    ### 3) Products

    Product master data.

    - product ID

    - cost

    - category

    - product name

    - brand

    - retail price

    - department

    - SKU

    - distribution center ID


    ### 4) Users

    Customer attributes for aggregate analysis.

    - user ID

    - age

    - gender

    - state

    - city

    - country

    - traffic source

    - created timestamp


    I also technically see some customer-identifying fields in the users table, but I won’t expose or
    analyze raw personal details like names, emails, street addresses, or exact location fields.


    ## How the tables connect

    - order items link to orders through order ID

    - order items link to products through product ID

    - orders and order items link to users through user ID


    ## What this means I can analyze

    Using these tables, I can help with:

    - sales and revenue trends

    - product/category/brand performance

    - return rates

    - shipping and delivery timing

    - customer mix by geography, age, gender, and acquisition source

    - repeat purchasing and behavior patterns

    - regional performance comparisons


    ## Important note

    Revenue is captured at the item level, so sales analysis comes from the order items data rather than
    the orders table.


    If you want, I can also turn this into a simple “data dictionary” table, or suggest 10 useful analyses
    you can ask for next.'
